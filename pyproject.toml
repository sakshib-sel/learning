[project]
name = "sentinel-learning"
version = "0.1.0"
description = "Hands-on Sentinel incident-analysis learning programme"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.69.0",
]

[project.optional-dependencies]
agent = [
  "claude-agent-sdk>=0.1.60",
]

[project.scripts]
sentinel-claude = "sentinel_claude.cli:main"
sentinel-tool-loop = "sentinel_claude.tool_loop:main"
sentinel-agent-sdk-demo = "sentinel_claude.agent_sdk_sim:main"
sentinel-evaluate = "sentinel_claude.evaluation:main"
sentinel-batch-sim = "sentinel_claude.batch_sim:main"
sentinel-cache-sim = "sentinel_claude.cache_sim:main"
